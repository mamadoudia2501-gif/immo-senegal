publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.5.0
  intl: '>=0.19.0 <0.21.0'
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
